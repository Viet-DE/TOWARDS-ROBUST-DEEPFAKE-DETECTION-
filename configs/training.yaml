training:
  # Optimizer
  optimizer:
    name: "adam"
    lr: 0.0001
    betas: [0.9, 0.999]
    weight_decay: 0.0001
  
  # Learning rate scheduler
  scheduler:
    name: "cosine"
    min_lr: 0.00001
    warmup_epochs: 5
    warmup_lr: 0.00001
  
  # Loss function
  loss:
    name: "cross_entropy"
    label_smoothing: 0.1
  
  # Training settings
  epochs: 50
  gradient_clip: 1.0
  mixed_precision: true
  
  # Early stopping
  early_stopping:
    enabled: true
    patience: 10
    metric: "val_acc"
    mode: "max"
  
  # Checkpointing
  checkpoint:
    save_dir: "checkpoints"
    save_frequency: 5
    save_best_only: true
    monitor: "val_acc"
    mode: "max"
  
  # Logging
  logging:
    log_dir: "logs"
    log_frequency: 10
    tensorboard: true
    
  # Validation
  val_frequency: 1
  
  device: "cuda"
  seed: 42